<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- App-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Leaf mark, tilted for a bit of motion -->
  <g transform="translate(256 266) rotate(-18) translate(-256 -266)">
    <path
      d="M256 108
         C 330 138, 372 206, 372 278
         C 372 356, 322 410, 256 434
         C 190 410, 140 356, 140 278
         C 140 206, 182 138, 256 108 Z"
      fill="#FFFFFF"
    />
    <!-- stem -->
    <path
      d="M256 434 C 252 452, 250 462, 244 470"
      stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"
    />
    <!-- center vein -->
    <path
      d="M256 148 C 250 220, 250 320, 256 404"
      stroke="#16A34A" stroke-width="10" stroke-linecap="round" fill="none"
    />
    <!-- side veins -->
    <path d="M256 210 C 290 224, 310 240, 322 258" stroke="#16A34A" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M256 210 C 222 224, 202 240, 190 258" stroke="#16A34A" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M256 300 C 284 312, 300 326, 310 342" stroke="#16A34A" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M256 300 C 228 312, 212 326, 202 342" stroke="#16A34A" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Expiry alert dot -->
  <circle cx="392" cy="128" r="46" fill="#FFFFFF"/>
  <circle cx="392" cy="128" r="34" fill="#F59E0B"/>
</svg>
